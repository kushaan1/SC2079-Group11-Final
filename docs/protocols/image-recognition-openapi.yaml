openapi: 3.0.3
info:
  title: SC2079 Image Recognition API
  version: 1.0.0
  description: Versioned Task 1 contract between the Raspberry Pi and host PC.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service is running.
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_version]
                properties:
                  status: {type: string, enum: [ok]}
                  schema_version: {type: string, enum: ['1.0']}
  /detect:
    post:
      operationId: detectImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, object_id]
              properties:
                image:
                  type: string
                  format: binary
                object_id:
                  type: string
                  minLength: 1
                  description: Arena obstacle identifier, not the recognised competition ID.
      responses:
        '200':
          description: Detection completed, including a valid no-detection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionResult'
        '400':
          description: Invalid multipart request or image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: Uploaded image exceeds the configured limit.
        '500':
          description: Inference failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  schemas:
    Detection:
      type: object
      required: [label, confidence, bbox, kind, competition_id, model_class_id]
      properties:
        label: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: integer, minimum: 0}
        kind: {type: string, enum: [target, bullseye, unknown]}
        competition_id:
          type: integer
          nullable: true
          minimum: 11
          maximum: 40
        model_class_id:
          type: integer
          nullable: true
    DetectionResult:
      type: object
      required: [schema_version, object_id, status, detection, detections, artifacts, error]
      properties:
        schema_version: {type: string, enum: ['1.0']}
        object_id: {type: string}
        status: {type: string, enum: [target, bullseye, no_detection, error]}
        detection:
          allOf: [{$ref: '#/components/schemas/Detection'}]
          nullable: true
        detections:
          type: array
          items: {$ref: '#/components/schemas/Detection'}
        artifacts:
          type: object
          required: [raw_image, annotated_image]
          properties:
            raw_image: {type: string, nullable: true}
            annotated_image: {type: string, nullable: true}
        error: {type: string, nullable: true}
    Error:
      type: object
      required: [schema_version, error]
      properties:
        schema_version: {type: string, enum: ['1.0']}
        error: {type: string}
